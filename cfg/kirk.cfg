; KIRK Processor Memory Map and Hardware Register Definitions
.default KIRK

.KIRK

; MEMORY MAP
area CODE ROM       0x0000:0x4000           Internal Mask ROM
area DATA RAM       0xE0000000:0xE0010000   Internal SRAM and Device MMIO

; ENTRY POINTS
entry _reset        0x0000                  Reset Vector
entry _start        0x0004                  Main Entry Point

; ECC HARDWARE ENGINE (0xE0000000)
ECC_CTRL            0xE0000000              ECC Engine Control / Strobe (0=init, 1=start)
ECC_STATUS          0xE0000004              ECC Engine Busy / IRQ Status
ECC_STATUS.ECC_READY 0                      ECC Operation Complete Flag
ECC_CMD             0xE0000008              ECC Operation Command (0=ECDSA_SIGN, 1=ECDSA_VERIFY, 2=POINT_MUL)
ECC_RESULT          0xE000000C              ECC Verification / Operation Result
ECC_RESULT.ECC_VALID 0                      ECC Signature / Point Valid Flag (1=valid, 0=invalid)
ECC_P               0xE000002C              ECC Curve Prime Modulus p (20 bytes)
ECC_A               0xE000004C              ECC Curve Coefficient a (20 bytes)
ECC_B               0xE000006C              ECC Curve Coefficient b (20 bytes)
ECC_N               0xE000008C              ECC Base Point Order n (20 bytes)
ECC_R2_MOD_P        0xE00000AC              ECC Montgomery Constant R^2 = 2^320 mod p (20 bytes)
ECC_R2_MOD_N        0xE00000CC              ECC Montgomery Constant R^2 = 2^320 mod n (20 bytes)
ECC_Gx              0xE00000EC              ECC Base Point Gx (20 bytes)
ECC_Gy              0xE000010C              ECC Base Point Gy (20 bytes)
ECC_X               0xE000012C              ECC Scalar k / Signature r (20 bytes)
ECC_X2              0xE000014C              ECC Private Key d / Signature s (20 bytes)
ECC_M               0xE000016C              ECC Message Digest e (20 bytes)
ECC_PUB_Px          0xE000018C              ECC Public Key Qx (20 bytes)
ECC_PUB_Py          0xE00001AC              ECC Public Key Qy (20 bytes)
ECC_OUT_X           0xE000022C              ECC Output Point X / Signature r (20 bytes)
ECC_OUT_Y           0xE000024C              ECC Output Point Y / Signature s (20 bytes)

; SHA-1 HARDWARE ENGINE (0xE0000CC0)
SHA1_CTRL           0xE0000CC0              SHA-1 Engine Control / Strobe (0=start)
SHA1_STATUS         0xE0000CC4              SHA-1 Engine Busy / IRQ Status
SHA1_STATUS.SHA1_READY 0                    SHA-1 Operation Complete Flag
SHA1_IN_SIZE        0xE0000CCC              SHA-1 Input Byte Length
SHA1_IN_DATA        0xE0000CD0              SHA-1 32-bit Input Data FIFO Port
SHA1_RESULT         0xE0000CD4              SHA-1 160-bit Digest Output (20 bytes)

; AES HARDWARE ENGINE (0xE0000E00)
AES_CTRL            0xE0000E00              AES Engine Control / Strobe (0=init, 1=crypt, 2=setkey)
AES_STATUS          0xE0000E04              AES Engine Busy / IRQ Status
AES_STATUS.AES_READY 0                      AES Operation Complete Flag
AES_CMD             0xE0000E08              AES Cipher Mode (0=ECB_ENC, 1=ECB_DEC, 0x12=CBC_ENC, 0x13=CBC_DEC, 0x32=CMAC)
AES_CMD.AES_DECRYPT 0                       AES Direction (0=encrypt, 1=decrypt)
AES_CMD.AES_INIT_IV 1                       AES Latch Initial IV on First Block (0=chain internal feedback)
AES_CMD.AES_CBC     4                       AES CBC Chaining Mode Enable
AES_CMD.AES_CMAC    5                       AES CMAC Final-Block Subkey XOR Enable
AES_END             0xE0000E0C              AES Total Stream Byte Length (for CMAC final block)
AES_SRC_BUF         0xE0000E10              AES 128-bit Input Block (16 bytes)
AES_KEY             0xE0000E20              AES 128-bit Key Register (16 bytes)
AES_IV              0xE0000E40              AES 128-bit Initial IV Register (16 bytes)
AES_RESULT          0xE0000E64              AES 128-bit Output Block / CMAC Tag (16 bytes)

; FIPS 186-2 SHA-1 PRNG HARDWARE ENGINE (0xE0001080)
PRNG_CTRL           0xE0001080              PRNG Engine Control / Strobe (0=init, 1=start)
PRNG_STATUS         0xE0001084              PRNG Engine Busy / IRQ Status
PRNG_STATUS.PRNG_READY 0                    PRNG Operation Complete Flag
PRNG_MODE           0xE0001088              PRNG Operation Mode (2=step internal XKEY, 3=latch XKEY and step)
PRNG_XKEY           0xE000108C              PRNG 160-bit State Key XKEY (20 bytes)
PRNG_XSEED          0xE00010A0              PRNG 160-bit Per-Step Input XSEED (20 bytes)
PRNG_RESULT         0xE00010B4              PRNG 160-bit G(t, XVAL) Output (20 bytes)

; HARDWARE TRNG ENGINE (0xE0001100)
TRNG_CTRL           0xE0001100              TRNG Engine Control / Strobe (0=init, 1=sample)
TRNG_STATUS         0xE0001104              TRNG Engine Busy / IRQ Status
TRNG_STATUS.TRNG_READY 0                    TRNG Entropy Sample Ready Flag
TRNG_MODE           0xE0001108              TRNG Sample Width Mode (0x100=256-bit entropy)
TRNG_OUT0           0xE000110C              TRNG Entropy Output Block 0 (16 bytes)
TRNG_OUT1           0xE000111C              TRNG Entropy Output Block 1 (16 bytes)

; BIGNUM MODULAR REDUCTION ENGINE: 512-bit mod 256-bit (0xE0001180)
MATH_CTRL           0xE0001180              Math Engine Control / Strobe (0=init, 1=reduce)
MATH_STATUS         0xE0001184              Math Engine Busy / IRQ Status
MATH_STATUS.MATH_READY 0                    Math Modular Reduction Complete Flag
MATH_IN_HI          0xE0001188              Math 512-bit Dividend Upper 192 bits (24 bytes)
MATH_IN_LO          0xE00011A0              Math 512-bit Dividend Lower 320 bits (40 bytes)
MATH_MOD_HI         0xE00011C8              Math 256-bit Modulus Upper 96 bits (12 bytes)
MATH_MOD_LO         0xE00011D4              Math 256-bit Modulus Lower 160 bits (20 bytes)
MATH_OUT_HI         0xE00011E8              Math 256-bit Remainder Upper 96 bits (12 bytes)
MATH_RESULT         0xE00011F4              Math 256-bit Remainder Lower 160 bits (20 bytes)

; HARDWARE KEY VAULT & CURVE ROM (0xE0001240)
PCK_KEY0            0xE0001240              Per-Console Fuse Key 0 (16 bytes)
PCK_KEY1            0xE0001250              Per-Console Fuse Key 1 (16 bytes)
PCK_KEY2            0xE0001260              Per-Console Fuse Key 2 (16 bytes)
PCK_KEY3            0xE0001270              Per-Console Fuse Key 3 / Reserved (16 bytes)
hw_keyslot          0xE0001280              Hardware Key Vault Slot Selector (0x00..0x83)
hw_slot_key         0xE0001284              Hardware Key Vault 128-bit Output (16 bytes)
hw_curve_param_id   0xE00012C0              Hardware Curve Key Selector (0,1=CMD1_Q, 2,3=CMD2_Q, 4=CMD2_d, 5,6=CMD3_Q)
hw_curve_param      0xE00012C4              Hardware Curve Parameter 160-bit Output (20 bytes)

; INTERNAL DMA ENGINE (0xE0003800)
hw_dma_ctrl         0xE0003800              DMA Engine Control / Strobe (0=init, 1=write_host, 2=read_host)
hw_dma_status       0xE0003804              DMA Engine Busy / IRQ Status
hw_dma_status.DMA_READY 0                   DMA Transfer Complete Flag
hw_dma_addr         0xE0003808              DMA Host Physical Address
hw_dma_size         0xE000380C              DMA Transfer Byte Size (1..32 bytes)
DMA_BUF             0xE0003840              DMA Internal 32-Byte Staging Buffer (32 bytes)

; HOST PSP INTERFACE REGISTERS (0xE0003880)
PSP_KIRK_REG        0xE0003880              Host Interface Control / Strobe (0=init, 1=notify_host)
PSP_KIRK_STATUS     0xE0003884              Host Interface Status
PSP_KIRK_STATUS.HOST_READY 0                Host Interface Ready Flag
PSP_KIRK_STATUS.KIRK_ENABLED 1              Host KIRK Interface Enable Flag
PSP_KIRK_PHASE      0xE0003888              Host Handshake Execution Phase (1=busy, 2=done)
PSP_KIRK_CMD        0xE00038C0              KIRK Service Command Number (0x00..0x12)
PSP_KIRK_SRC        0xE00038C4              KIRK Source Physical Address
PSP_KIRK_DST        0xE00038C8              KIRK Destination Physical Address
PSP_KIRK_RESULT     0xE00038CC              KIRK Service Return Status Code

; SYSTEM STATUS & SCRATCHPAD WORKSPACE RAM (0xE0003EC0..0xE0003FFC)
isRetailMode        0xE0003EC0              Boot Mode Strap Register
isRetailMode.RETAIL_MODE 0                  Retail Boot Mode (1=skip power-on FIPS KAT, 0=run KAT)
FIPS_STATUS         0xE0003EE0              FIPS 140-2 Power-On Self-Test Status
R0                  0xE0003F00              Workspace Register R0 (Byte Size / Count)
R1                  0xE0003F04              Workspace Register R1 (Source Physical Address)
R2                  0xE0003F08              Workspace Register R2 (Destination Physical Address)
R3                  0xE0003F0C              Workspace Register R3
R4                  0xE0003F10              Workspace Register R4
R5                  0xE0003F14              Workspace Register R5
R6                  0xE0003F18              Workspace Register R6
R7                  0xE0003F1C              Workspace Register R7
R8                  0xE0003F20              Workspace Register R8
R9                  0xE0003F24              Workspace Register R9
R10                 0xE0003F28              Workspace Register R10
R11                 0xE0003F2C              Workspace Register R11 (Pointer 1 / ScratchBuf)
R12                 0xE0003F30              Workspace Register R12 (Pointer 2)
R13                 0xE0003F34              Workspace Register R13 (Loop Counter)
R14                 0xE0003F38              Workspace Register R14
R15                 0xE0003F3C              Workspace Register R15 (Saved Header Flags)
KIRK_BODY_SIZE      0xE0003F44              Current Command Payload Size
DATA_OFFSET         0xE0003F48              Current Command Data Offset
aes_key_tmp         0xE0003FD0              Temporary 128-bit AES Key (16 bytes)
keyseed             0xE0003FE0              PRNG Per-Console Key Seed (16 bytes)
kirk_semaphor       0xE0003FFC              Internal Firmware State Flags
kirk_semaphor.PRNG_SEEDED 0                 PRNG Initialized Flag
kirk_semaphor.USE_USER_CURVE 1              Select User ECDSA Curve 2 Order for Scalar Gen
